openapi: 3.0.3
info:
  title: Moderation API
  description: >
    OpenAPI-контракт сервиса Moderation. Описывает приём событий о товаре от
    B2B (US-MOD-01): идемпотентный приём `PRODUCT_CREATED` / `PRODUCT_EDITED`
    / `PRODUCT_DELETED` и переходы карточки модерации между статусами
    `PENDING` / `IN_REVIEW` / `MODERATED` / `BLOCKED` / `HARD_BLOCKED` /
    `ARCHIVED`. Действия модератора: одобрение (US-MOD-03) и жёсткая блокировка
    (US-MOD-05).
  version: 0.2.0

servers:
  - url: /api/v1

paths:
  /b2b/events:
    post:
      summary: Событие об изменении товара от B2B
      description: >
        Принимает события о товарах от B2B (`PRODUCT_CREATED`,
        `PRODUCT_EDITED`, `PRODUCT_DELETED`) и обновляет карточку товара в
        очереди модерации (`moderation.cards`).

        - `PRODUCT_CREATED` создаёт карточку в `PENDING`.
        - `PRODUCT_EDITED` для карточки в `PENDING`/`IN_REVIEW` обновляет
          `json_after` на месте; для `MODERATED`/`BLOCKED`/`ARCHIVED` возвращает
          карточку в `PENDING` и сохраняет предыдущий снимок в `json_before`;
          для `HARD_BLOCKED` не меняет карточку.
        - `PRODUCT_DELETED` переводит карточку в `ARCHIVED` (уходит из
          очереди).

        Идемпотентность по `idempotency_key` события (генерируется B2B):
        повторный вызов с тем же ключом возвращает `409 DUPLICATE_EVENT` без
        побочных эффектов.

        Эндпоинт защищён заголовком `X-Service-Key` (service-to-service, как
        `POST /api/v1/b2b/events` в B2B) — без него или с неверным
        ключом `401 UNAUTHORIZED`.
      operationId: receiveProductEvent
      tags:
        - b2b-events
      security:
        - serviceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEventRequest"
      responses:
        "202":
          description: Событие принято и обработано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventResponse"
        "401":
          description: Отсутствует или неверен `X-Service-Key`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: "Invalid or missing service key"
        "409":
          description: Событие с этим `idempotency_key` уже было обработано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DUPLICATE_EVENT
                message: "Event with this idempotency_key has already been processed"
        "422":
          description: Невалидное тело запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: "Request validation failed"

  /tickets/{ticket_id}/approve:
    post:
      summary: Одобрить товар (US-MOD-03)
      description: >
        Переводит тикет модерации из `IN_REVIEW` в `MODERATED`. Только
        модератор, которому назначен тикет, может его одобрить.
        Публикует событие `MODERATED` в outbox для B2B.
      operationId: approveTicket
      tags:
        - tickets
      security:
        - moderatorKeyAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Тикет одобрен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "403":
          description: Нет доступа (тикет назначен другому модератору или HARD_BLOCKED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Тикет не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Тикет не в статусе IN_REVIEW или нет SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{ticket_id}/block:
    post:
      summary: Заблокировать товар — soft или hard block (US-MOD-05)
      description: >
        Переводит тикет из `IN_REVIEW` в `BLOCKED` (мягкая блокировка) или
        `HARD_BLOCKED` (жёсткая блокировка, терминальный статус).

        Если хотя бы одна из переданных причин (`blocking_reason_ids`) имеет
        `hard_block = true` — карточка переходит в `HARD_BLOCKED`, иначе —
        в `BLOCKED`.

        `HARD_BLOCKED` — терминальный статус: любая последующая попытка
        изменить тикет (approve, block) вернёт `403 FORBIDDEN`. Снятие
        блокировки возможно только через Django Admin (data-fix с audit log).

        Публикует событие `BLOCKED` в outbox для B2B. Поле `hard_block: true`
        сигнализирует B2B о каскаде в B2C (US-B2B-09).
      operationId: blockTicket
      tags:
        - tickets
      security:
        - moderatorKeyAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "200":
          description: Тикет заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "403":
          description: >
            Нет доступа (тикет назначен другому модератору или уже в
            терминальном статусе HARD_BLOCKED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Тикет или причина блокировки не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Тикет не в статусе IN_REVIEW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    serviceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >
        Service-to-service ключ для вызовов от B2B. Не связан с
        аутентификацией пользователей (JWT).

    moderatorKeyAuth:
      type: apiKey
      in: header
      name: X-Moderator-ID
      description: >
        UUID модератора, выполняющего действие. Передаётся как заголовок
        `X-Moderator-ID`.

  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: Доп. данные об ошибке (структура зависит от `code`)

    ModerationCardStatus:
      type: string
      enum:
        - PENDING
        - IN_REVIEW
        - MODERATED
        - BLOCKED
        - HARD_BLOCKED
        - ARCHIVED

    TicketKind:
      type: string
      description: >
        Тип тикета модерации.
        `CREATE` — тикет создан при первичной публикации товара продавцом.
        `EDIT` — тикет создан при повторной отправке после предыдущего решения
        модератора (MODERATED / BLOCKED / ARCHIVED → PENDING).
      enum:
        - CREATE
        - EDIT

    TicketStatus:
      type: string
      description: >
        Статус тикета в API-ответе. Отличается от внутреннего `ModerationStatus`:
        `MODERATED` → `APPROVED` (семантически корректнее для клиентов).
      enum:
        - PENDING
        - IN_REVIEW
        - APPROVED
        - BLOCKED
        - HARD_BLOCKED

    TicketResponse:
      type: object
      required:
        - id
        - product_id
        - seller_id
        - kind
        - status
        - queue_priority
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: UUID тикета модерации
        product_id:
          type: string
          format: uuid
          description: UUID товара
        seller_id:
          type: string
          format: uuid
          description: UUID продавца
        kind:
          $ref: "#/components/schemas/TicketKind"
        status:
          $ref: "#/components/schemas/TicketStatus"
        queue_priority:
          type: integer
          description: Приоритет в очереди (1 — новый, 2 — повтор BLOCKED, 3 — повтор MODERATED)
        created_at:
          type: string
          format: date-time

    ApproveRequest:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Комментарий модератора (опционально)

    FieldReport:
      type: object
      required:
        - field_path
        - message
      properties:
        field_path:
          type: string
          minLength: 1
          maxLength: 255
          description: Путь к полю с нарушением (например, `description`, `skus[0].price`)
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: Описание нарушения для этого поля

    BlockRequest:
      type: object
      required:
        - blocking_reason_ids
      properties:
        blocking_reason_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >
            Список UUID причин блокировки. Минимум одна причина обязательна.
            Если хотя бы одна причина имеет `hard_block = true`, карточка
            переходит в `HARD_BLOCKED`.
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Комментарий модератора (опционально)
        field_reports:
          type: array
          items:
            $ref: "#/components/schemas/FieldReport"
          default: []
          description: Список нарушений по конкретным полям товара

    ProductEventPayload:
      type: object
      required:
        - product_id
        - seller_id
        - json_after
      properties:
        product_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        json_before:
          type: object
          nullable: true
          description: >
            Предыдущий снимок товара (опционально, только для `PRODUCT_EDITED`).
          additionalProperties: true
        json_after:
          type: object
          description: >
            Текущий слепок полей товара от B2B (title, description,
            category_id, price, images, skus и т.п.). Сохраняется как есть в
            `json_after` карточки.
          additionalProperties: true

    ProductEventRequest:
      type: object
      required:
        - event_type
        - idempotency_key
        - occurred_at
        - payload
      properties:
        event_type:
          type: string
          enum:
            - PRODUCT_CREATED
            - PRODUCT_EDITED
            - PRODUCT_DELETED
        idempotency_key:
          type: string
          format: uuid
          description: Генерируется B2B, сохраняется как есть для идемпотентности.
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/ProductEventPayload"

    ProductEventResponse:
      type: object
      required:
        - idempotency_key
        - processed
      properties:
        idempotency_key:
          type: string
          format: uuid
        processed:
          type: boolean
          description: "`true` — событие успешно обработано."
        card_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/ModerationCardStatus"
          nullable: true
          description: Итоговый статус карточки после обработки события

    ModerationEventRequest:
      type: object
      required:
        - idempotency_key
        - product_id
        - event_type
        - occurred_at
      description: >
        Событие о решении модератора, публикуемое в outbox для B2B.
        Отправляется через `POST /api/v1/b2b/events` в B2B.
      properties:
        idempotency_key:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - MODERATED
            - BLOCKED
        hard_block:
          type: boolean
          description: >
            `true` — жёсткая блокировка (`HARD_BLOCKED`). B2B должен инициировать
            каскад в B2C (US-B2B-09). Только при `event_type: BLOCKED`.
          default: false
        blocking_reason_id:
          type: string
          format: uuid
          nullable: true
          description: UUID первичной причины блокировки (только при `event_type: BLOCKED`)
        field_reports:
          type: array
          items:
            type: object
            properties:
              field_name:
                type: string
                description: Имя поля (маппинг из `field_path`)
              comment:
                type: string
                description: Описание нарушения (маппинг из `message`)
          default: []
        occurred_at:
          type: string
          format: date-time
