openapi: 3.0.3
info:
  title: Moderation API
  description: >
    OpenAPI-контракт сервиса Moderation. Описывает приём событий о товаре от
    B2B (US-MOD-01): идемпотентный приём `PRODUCT_CREATED` / `PRODUCT_EDITED`
    / `PRODUCT_DELETED` и переходы карточки модерации между статусами
    `PENDING` / `IN_REVIEW` / `MODERATED` / `BLOCKED` / `HARD_BLOCKED` /
    `ARCHIVED`, а также одобрение товара модератором (US-MOD-03):
    `IN_REVIEW` → `MODERATED` и исходящее событие `MODERATED` для B2B.
  version: 0.2.0

servers:
  - url: /api/v1

paths:
  /events/product:
    post:
      summary: Событие об изменении товара от B2B
      description: >
        Принимает события о товарах от B2B (`PRODUCT_CREATED`,
        `PRODUCT_EDITED`, `PRODUCT_DELETED`) и обновляет карточку товара в
        очереди модерации (`moderation.cards`).

        - `PRODUCT_CREATED` создаёт карточку в `PENDING`.
        - `PRODUCT_EDITED` для карточки в `PENDING`/`IN_REVIEW` обновляет
          снимок на месте; для `MODERATED`/`BLOCKED`/`ARCHIVED` возвращает
          карточку в `PENDING` и сохраняет предыдущий снимок в `json_before`;
          для `HARD_BLOCKED` не меняет карточку.
        - `PRODUCT_DELETED` переводит карточку в `ARCHIVED` (уходит из
          очереди).

        Идемпотентность по `idempotency_key` события (генерируется B2B):
        повторный вызов с тем же ключом возвращает `processed: false` без
        побочных эффектов.

        Эндпоинт защищён заголовком `X-Service-Key` (service-to-service, как
        `POST /api/v1/events/moderation` в B2B) — без него или с неверным
        ключом `401 UNAUTHORIZED`.
      operationId: receiveProductEvent
      tags:
        - events
      security:
        - serviceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEventRequest"
      responses:
        "200":
          description: >
            Событие обработано (или повторный вызов с тем же
            `idempotency_key` — без побочных эффектов)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventResponse"
        "401":
          description: Отсутствует или неверен `X-Service-Key`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: "Invalid or missing service key"
        "422":
          description: Невалидное тело запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: VALIDATION_ERROR
                message: "Request validation failed"

  /cards/{card_id}/approve:
    post:
      summary: Одобрение карточки товара модератором
      description: >
        Переводит карточку из `IN_REVIEW` в `MODERATED` и публикует исходящее
        событие `MODERATED` для B2B (`POST /api/v1/moderation/events`,
        см. `services/b2b/docs/US-B2B-09.md`).

        Предусловия:
        - карточка существует;
        - `card.moderator_id` совпадает с `user_id` из токена — иначе
          `403 FORBIDDEN`;
        - карточка в статусе `IN_REVIEW` — иначе `409 CONFLICT` (например,
          продавец отредактировал товар во время проверки, и карточка
          вернулась в `PENDING`);
        - у товара есть хотя бы один SKU (`json_after.skus` непусто) — иначе
          `409 CONFLICT`.

        Исходящее событие `MODERATED` идемпотентно: повторная доставка одного
        и того же `idempotency_key` не приводит к повторной публикации в
        каталоге (см. `flows/moderation-flows.md#approve-product`).
      operationId: approveCard
      tags:
        - cards
      security:
        - bearerAuth: []
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Карточка переведена в `MODERATED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveCardResponse"
        "401":
          description: Отсутствует или неверен `Authorization: Bearer`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHORIZED
                message: "Missing bearer token"
        "403":
          description: Карточка закреплена за другим модератором
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: "Card is assigned to a different moderator"
        "404":
          description: Карточка не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: NOT_FOUND
                message: "Moderation card not found"
        "409":
          description: >
            Карточка не в `IN_REVIEW` (например, вернулась в `PENDING` после
            правки продавца) или у товара нет SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notInReview:
                  value:
                    code: CONFLICT
                    message: "Card is not in IN_REVIEW status"
                missingSku:
                  value:
                    code: CONFLICT
                    message: "Product has no SKUs and cannot be approved"

components:
  securitySchemes:
    serviceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: >
        Service-to-service ключ для вызовов от B2B. Не связан с
        аутентификацией пользователей (JWT).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT модератора (claim `user_id`), как в других пользовательских
        эндпоинтах NeoMarket. Не связан с `X-Service-Key`.

  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: Доп. данные об ошибке (структура зависит от `code`)

    ModerationCardStatus:
      type: string
      enum:
        - PENDING
        - IN_REVIEW
        - MODERATED
        - BLOCKED
        - HARD_BLOCKED
        - ARCHIVED

    ProductEventPayload:
      type: object
      required:
        - product_id
        - seller_id
      properties:
        product_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        snapshot:
          type: object
          description: >
            Текущий слепок полей товара от B2B (title, description,
            category_id, price, images, skus и т.п.). Сохраняется как есть в
            `json_after` карточки.
          additionalProperties: true

    ProductEventRequest:
      type: object
      required:
        - event_type
        - idempotency_key
        - occurred_at
        - payload
      properties:
        event_type:
          type: string
          enum:
            - PRODUCT_CREATED
            - PRODUCT_EDITED
            - PRODUCT_DELETED
        idempotency_key:
          type: string
          format: uuid
          description: Генерируется B2B, сохраняется как есть для идемпотентности.
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/ProductEventPayload"

    ApproveCardResponse:
      type: object
      required:
        - card_id
        - status
      properties:
        card_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ModerationCardStatus"

    ProductEventResponse:
      type: object
      required:
        - idempotency_key
        - processed
      properties:
        idempotency_key:
          type: string
          format: uuid
        processed:
          type: boolean
          description: >
            `false`, если событие с этим `idempotency_key` уже было
            обработано ранее (повтор без побочных эффектов)
        card_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/ModerationCardStatus"
          nullable: true
          description: Итоговый статус карточки после обработки события
