[project]
name = "moderation"
version = "0.1.0"
description = "NeoMarket Moderation service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "alembic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg2-binary",
    "asyncpg",
    "python-dotenv",
    "aio-pika>=9.6.2",
    "python-jose>=3.5.0",
    "httpx~=0.28",
]

[tool.ruff]
lint.extend-select = [
    "FAST",
    "ANN",
    "S",
    "BLE",
    "B",
    "C4",
    "FIX",
    "LOG",
    "Q",
    "ARG",
    "PTH",
    "N",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S607"]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "testcontainers~=4.14",
    "factory-boy>=3.3.0",
]
