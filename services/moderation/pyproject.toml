[project]
name = "moderation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.6.2",
    "aiosqlite>=0.22.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.41.0",
]

[tool.ruff]
lint.extend-select = ["FAST", "ANN", "S", "BLE", "B", "C4", "LOG", "Q", "ARG", "PTH", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]
